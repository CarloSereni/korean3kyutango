<style>
@font-face{font-family:'sysfallback';src:local('sans-serif');}
:root{
  --bg:#eee9df; --paper:#fbf8f2; --card:#ffffff;
  --ink:#1f3350; --ink2:#3b5170; --sub:#8a8172;
  --accent:#a6321f; --accent-d:#7c2517;
  --ok:#2f6b4f; --ok-bg:#e2ede6;
  --keep:#8a6d1f; --keep-bg:#f3ebd6;
  --line:#ddd6c8; --line2:#cfc6b4;
  --shadow:0 3px 10px rgba(31,51,80,.08), 0 1px 3px rgba(31,51,80,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Noto Sans KR','Noto Sans JP',-apple-system,'Hiragino Sans',sans-serif;
  overscroll-behavior-y:contain;}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);
  box-shadow:0 0 24px rgba(0,0,0,.06);display:flex;flex-direction:column;}

/* top bar */
#topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20;}
#topbar .back{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);
  background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--ink);font-size:16px;}
#topbar .back.hidden{visibility:hidden;}
#topbar h1{font-family:'Gowun Batang','Noto Serif KR',serif;font-size:17px;margin:0;flex:1;
  letter-spacing:.02em;font-weight:700;}
#topbar .stamp{font-size:10px;color:var(--sub);border:1px solid var(--line2);border-radius:5px;padding:2px 6px;}

#main{flex:1;padding:16px;padding-bottom:32px;}
.hidden{display:none !important;}

/* home */
.hero{text-align:center;padding:22px 8px 26px;}
.hero .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--sub);text-transform:uppercase;margin-bottom:6px;}
.hero h2{font-family:'Gowun Batang','Noto Serif KR',serif;font-size:28px;margin:0 0 6px;color:var(--ink);}
.hero p{font-size:13px;color:var(--sub);margin:0;}
.menu-grid{display:flex;flex-direction:column;gap:12px;}
.menu-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;}
.menu-card .ico{width:44px;height:44px;border-radius:10px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.menu-card .tx b{display:block;font-size:15.5px;margin-bottom:2px;}
.menu-card .tx span{font-size:12px;color:var(--sub);}
.menu-card .tag{margin-left:auto;font-family:'Gowun Batang',serif;font-size:20px;color:var(--line2);flex-shrink:0;}

/* setup screens */
.setup-block{margin-bottom:20px;}
.setup-block h3{font-size:12.5px;color:var(--sub);letter-spacing:.06em;margin:0 0 8px;text-transform:uppercase;}
.tabs{display:flex;flex-wrap:wrap;gap:8px;}
.tabrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;
  cursor:pointer;color:var(--ink);white-space:nowrap;}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.chip.disabled{opacity:.4;cursor:not-allowed;}
.chip small{display:block;font-size:9px;opacity:.7;}
.startbtn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;box-shadow:0 3px 8px rgba(166,50,31,.28);}
.startbtn:disabled{background:#c9c2b3;box-shadow:none;cursor:not-allowed;}
.subnote{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5;}

/* flashcard */
#fcHeader{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:10px;}
#fcHeader .setbtns{display:flex;gap:6px;}
#fcHeader .setbtn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:4px 9px;font-size:11.5px;cursor:pointer;color:var(--ink2);}
.progress-bar{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px;}
.progress-bar i{display:block;height:100%;background:var(--ink);}

.stage{position:relative;height:390px;}
.card-outer{position:absolute;inset:0;perspective:1400px;transition:transform .25s ease, opacity .25s ease;}
.card-outer.leaving-l{transform:translateX(-40px);opacity:0;}
.card-outer.leaving-r{transform:translateX(40px);opacity:0;}
.card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);}
.card-outer.flipped .card-inner{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;}
.card-face.back{transform:rotateY(180deg);overflow-y:auto;}
.pos-badge{align-self:flex-start;font-size:10.5px;color:#fff;background:var(--ink2);border-radius:6px;
  padding:2px 8px;letter-spacing:.03em;margin-bottom:auto;}
.cf-num{position:absolute;top:16px;right:18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--line2);}
.front-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;}
.kr-word{font-family:'Gowun Batang','Noto Serif KR',serif;font-size:34px;font-weight:700;color:var(--ink);}
.kr-read{font-size:14px;color:var(--sub);}
.ja-word{font-size:26px;font-weight:700;color:var(--ink);}
.spk{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;
  background:var(--paper);border:1px solid var(--line2);color:var(--ink2);cursor:pointer;font-size:20px;flex-shrink:0;}
.spk:active{background:var(--line);}
.tapfoot{text-align:center;font-size:11px;color:var(--sub);}
.back .bhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.back .bhead .kr{font-family:'Gowun Batang',serif;font-size:20px;font-weight:700;}
.back .bhead .hanja{font-size:13px;color:var(--sub);}
.back .ja-line{font-size:15px;font-weight:700;margin-bottom:8px;color:var(--ink2);}
.irr-line{font-size:12px;background:#fdeee9;color:var(--accent-d);border-radius:6px;padding:4px 8px;margin-bottom:8px;display:inline-block;}
.note-line{font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:10px;}
.ex-box{background:var(--paper);border-radius:10px;padding:10px 12px;border:1px solid var(--line);}
.ex-kr{font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.ex-ja{font-size:12.5px;color:var(--sub);}
.ex-en{font-size:11.5px;color:var(--sub);font-style:italic;margin-top:2px;}

.card-actions{display:flex;gap:10px;margin-top:16px;}
.act-btn{flex:1;padding:13px 6px;border-radius:12px;border:1px solid var(--line2);background:#fff;
  font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink);}
.act-btn.memo{color:var(--ok);border-color:var(--ok);background:var(--ok-bg);}
.act-btn.later{color:var(--keep);border-color:var(--keep);background:var(--keep-bg);}
.deckdone{text-align:center;padding:60px 10px;color:var(--sub);}
.deckdone .big{font-size:40px;margin-bottom:10px;}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(31,25,15,.4);z-index:60;display:flex;align-items:flex-end;}
.modal-sheet{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;
  max-height:78vh;overflow-y:auto;padding:18px;}
.modal-sheet h3{margin:0 0 12px;font-size:15px;}
.modal-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.modal-row button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;}
.modal-close{width:100%;padding:11px;border:none;border-radius:10px;background:var(--ink);color:#fff;margin-top:14px;font-size:14px;cursor:pointer;}
.empty-note{color:var(--sub);font-size:13px;padding:12px 0;}

/* quiz */
.quiz-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow);}
.quiz-item .qnum{font-size:11.5px;color:var(--sub);margin-bottom:6px;}
.quiz-item .stem{font-size:16px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.quiz-item .stem-read{font-size:12px;color:var(--sub);font-weight:400;}
.qopt{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line2);border-radius:9px;margin-top:7px;font-size:13.5px;cursor:pointer;}
.qopt input{margin:0;}
.qopt.correct{border-color:var(--ok);background:var(--ok-bg);}
.qopt.wrong{border-color:var(--accent);background:#fbe9e6;}
.qctrl{display:flex;gap:8px;align-items:center;margin-top:10px;}
.qctrl button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;}
.qresult{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:6px;}
.qresult.ok{color:var(--ok);background:var(--ok-bg);}
.qresult.ng{color:var(--accent);background:#fbe9e6;}
.explain{margin-top:10px;background:var(--paper);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--ink2);line-height:1.6;}
.scorebar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 4px;
  display:flex;justify-content:space-between;align-items:center;margin:14px -16px -16px;padding-left:16px;padding-right:16px;}
.scorebar b{font-size:18px;}
.scorebar button{background:var(--ink);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:13px;cursor:pointer;}

/* matching */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px;}
.mcard{aspect-ratio:1/1.05;border-radius:12px;display:flex;align-items:center;
  justify-content:center;text-align:center;cursor:pointer;padding:6px;box-shadow:var(--shadow);
  transition:transform .12s, background .15s, border-color .15s;line-height:1.15;
  border:2px solid transparent;background:#fff;overflow:hidden;}
.mcard .mtext{font-size:clamp(14px,5.6vw,22px);font-weight:800;word-break:keep-all;}
.mcard.kr{border-color:var(--ink2);}
.mcard.kr .mtext{color:var(--ink);}
.mcard.ja{border-color:var(--accent);}
.mcard.ja .mtext{color:var(--accent-d);}
.mcard.selected{border-color:#2f6b4f;box-shadow:0 0 0 3px rgba(47,107,79,.25);transform:scale(1.05);}
.mcard.mismatch{border-color:var(--accent);background:#fbe9e6;animation:shake .3s;}
.mcard.matched{background:#eee9df;border-color:var(--line2);cursor:default;}
.mcard.matched .mtext{color:#b8b0a0;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.mcard.facedown{background:var(--ink2);}
.mcard.facedown.kr-back{background:var(--ink2);}
.mcard.facedown.ja-back{background:var(--accent);}
.mcard.facedown .mtext{color:rgba(255,255,255,.55);font-size:15px;font-weight:900;letter-spacing:.05em;}
.mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;}
.mtop .timer{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;}
.mwin{text-align:center;padding:30px 10px;}
.mwin .big{font-size:32px;font-weight:700;margin:10px 0;}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin-bottom:10px;}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

.footer-note{text-align:center;font-size:11px;color:var(--sub);margin-top:26px;line-height:1.7;}
.fc-range{width:100%;height:34px;margin:0 0 12px;accent-color:var(--ink);}
table.wl{width:100%;border-collapse:collapse;font-size:13px;background:#fff;}
.wl th{background:var(--paper);font-size:11.5px;color:var(--sub);text-align:left;padding:6px;border-bottom:1px solid var(--line2);}
.wl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5;}
.wl-a{width:30%;}.wl-b{width:28%;}
.wl-no{display:block;font-size:10.5px;color:var(--sub);}
.wl-sub{font-size:11.5px;color:var(--sub);}
.wl-ex2{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line2);}
.inv-phone{background:#0b0b2a;border-radius:14px;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none;}
.inv-hud{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:13px;background:#101040;}
.inv-hud b{font-size:20px;font-variant-numeric:tabular-nums;}
.inv-mb{display:inline-block;padding:4px 8px;border:1px solid #4a56c8;border-radius:8px;font-size:11px;margin-left:6px;cursor:pointer;}
.inv-mb.off{opacity:.4;text-decoration:line-through;}
.inv-field{position:relative;height:clamp(220px,38vh,320px);overflow:hidden;background-color:#0b0b2a;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#9aa3ff 1px,transparent 1.5px);background-size:64px 64px,97px 97px;background-position:0 0,23px 41px;}
.inv-line{position:absolute;left:0;right:0;bottom:62px;border-top:2px dashed #ff5a4d;opacity:.7;}
.inv-en{position:absolute;top:0;font-size:40px;line-height:1;margin-left:-20px;animation:invfall 10s linear forwards;}
@keyframes invfall{from{transform:translateY(0)}to{transform:translateY(var(--fy,200px))}}
.inv-cn{position:absolute;left:50%;bottom:8px;width:0;}
.inv-base{position:absolute;left:-30px;bottom:0;width:60px;height:24px;background:#6c7bff;border-radius:6px 6px 0 0;}
.inv-bar{position:absolute;left:-7px;bottom:16px;width:14px;height:38px;background:#c9d0ff;border-radius:4px 4px 0 0;transform-origin:50% 100%;}
.inv-beam{position:absolute;left:50%;width:6px;margin-left:-3px;background:#7dfcff;border-radius:3px;transform-origin:50% 100%;display:none;}
.inv-boom{position:absolute;font-size:46px;margin:-23px 0 0 -23px;animation:invpop .5s ease-out forwards;}
@keyframes invpop{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
.inv-toast{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:15px;font-weight:700;color:#ffb3ab;min-height:22px;z-index:2;}
.inv-panel{background:#15154a;padding:10px 12px 14px;}
.inv-q{text-align:center;font-size:30px;font-weight:700;margin-bottom:10px;min-height:42px;line-height:1.3;}
.inv-q small{font-size:13px;font-weight:400;color:#aab;margin-left:6px;}
.inv-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.inv-opt{min-height:54px;border:1px solid #4a56c8;background:#1d1d63;color:#fff;border-radius:10px;font-size:17px;font-family:inherit;touch-action:manipulation;}
.inv-opt small{display:block;font-size:11px;color:#aab;}
.inv-opt.ng{background:#7a1f1f;border-color:#ff6b6b;animation:invsh .3s;}
@keyframes invsh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.iv-tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff;}
.iv-tbl th,.iv-tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;}
.iv-tbl .spk{width:32px;height:32px;font-size:15px;margin-left:4px;}
.iv-new{background:#fff3c4;}
.iv-ok{color:#1f9d55;font-weight:700;}.iv-ng{color:#d33;font-weight:700;}.iv-re{color:#c98a00;font-weight:700;}
input,textarea{-webkit-user-select:text;user-select:text;}
.sbar{display:flex;gap:8px;margin:0 0 16px;}
.sbar input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line2);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit;}
.sbar button{padding:0 18px;border:none;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0;}
.sres{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);}
.sres .u{font-size:10.5px;color:#fff;background:var(--ink2);border-radius:6px;padding:2px 7px;flex-shrink:0;white-space:nowrap;}
.sres .k{font-family:'Gowun Batang','Noto Serif KR',serif;font-size:17px;font-weight:700;}
.sres .k small{font-family:inherit;font-size:11.5px;color:var(--sub);font-weight:400;margin-left:4px;}
.sres .j{font-size:13px;color:var(--ink2);margin-top:1px;}
.sres .p{margin-left:auto;font-size:10.5px;color:var(--sub);flex-shrink:0;}
.home-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px;cursor:pointer;}
.home-sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;box-shadow:var(--shadow);}
.home-sum b{display:block;font-size:19px;color:var(--ink);}
.home-sum span{font-size:10.5px;color:var(--sub);}
.gtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px;}
.gtile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;box-shadow:var(--shadow);}
.gtile b{display:block;font-size:22px;color:var(--ink);line-height:1.2;}
.gtile b small{font-size:11px;font-weight:400;color:var(--sub);margin-left:1px;}
.gtile span{display:block;font-size:10px;color:var(--sub);line-height:1.3;margin-top:2px;}
.gtile.g b{color:var(--ok);}
.goal-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.goal-card .gh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.goal-card .gt{font-size:15px;font-weight:700;}
.goal-card .gs{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.5;}
.goal-card .gx{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--sub);flex-shrink:0;}
.goal-card .gb{display:flex;align-items:center;gap:14px;margin-top:10px;}
.goal-card .gi{flex:1;font-size:12.5px;color:var(--ink2);line-height:1.7;}
.goal-card .gi b{color:var(--ink);}
.gbar{height:9px;background:var(--line);border-radius:5px;overflow:hidden;margin:4px 0 2px;}
.gbar i{display:block;height:100%;background:var(--ink2);border-radius:5px;}
.gbar i.ok{background:var(--ok);}
.gbadge{display:inline-block;font-size:10.5px;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle;}
.gbadge.ok{background:var(--ok-bg);color:var(--ok);}
.gbadge.ng{background:#eee9df;color:var(--sub);}
.gbadge.up{background:var(--keep-bg);color:var(--keep);}
.num-in,.date-in{padding:9px 10px;border:1px solid var(--line2);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit;}
.num-in{width:84px;}
.row-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.prev-box{background:var(--paper);border:1px dashed var(--line2);border-radius:12px;padding:12px;font-size:13px;line-height:1.7;color:var(--ink2);}
.prev-box b{color:var(--ink);}
.prev-box .err{color:var(--accent);font-weight:700;}
.chart14{display:flex;align-items:flex-end;gap:4px;height:100px;padding-top:4px;}
.chart14 .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;}
.chart14 .bar{width:100%;border-radius:4px 4px 0 0;background:#c9c2b3;min-height:2px;}
.chart14 .bar.s{background:var(--ink2);}
.chart14 .bar.a{background:var(--ok);}
.chart14 .v{font-size:9px;color:var(--sub);height:12px;line-height:12px;}
.chart14 .l{font-size:9px;color:var(--sub);margin-top:2px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-head b{font-family:'Gowun Batang','Noto Serif KR',serif;font-size:18px;}
.cal-head button{width:38px;height:34px;border:1px solid var(--line2);background:#fff;border-radius:8px;font-size:15px;cursor:pointer;color:var(--ink);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:10.5px;color:var(--sub);padding:2px 0;}
.cal-cell{aspect-ratio:1/1.12;border:1px solid var(--line);border-radius:8px;background:#fff;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-cell.empty{border:none;background:none;cursor:default;}
.cal-cell .cd{position:absolute;top:2px;left:4px;font-size:10px;color:var(--sub);}
.cal-cell .cn{font-size:15px;font-weight:700;color:var(--ink);margin-top:6px;}
.cal-cell .cm{position:absolute;bottom:1px;right:3px;font-size:10px;color:var(--ok);font-weight:700;}
.cal-cell.st{background:#e8eef7;border-color:#c5d2e6;}
.cal-cell.ach{background:var(--ok-bg);border-color:var(--ok);}
.cal-cell.miss{background:#fbe9e6;border-color:#e9b9b0;}
.cal-cell.fut{opacity:.55;}
.cal-cell.today{outline:2px solid var(--accent);outline-offset:-1px;}
.cal-cell.sel{box-shadow:0 0 0 2px var(--ink);}
.cal-leg{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--sub);margin:10px 0 14px;}
.cal-leg span{display:inline-flex;align-items:center;gap:5px;}
.cal-leg i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line2);}
.cal-det{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);font-size:13px;line-height:1.7;color:var(--ink2);}
.cal-det h4{margin:0 0 6px;font-size:14.5px;color:var(--ink);}
.cal-words{max-height:150px;overflow-y:auto;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line2);font-size:12px;}
.cal-words span{display:inline-block;margin:0 10px 3px 0;white-space:nowrap;}
.cal-words small{color:var(--sub);}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:90;max-width:90%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);}
</style>

/* ============ ストレージ ============ */
const STORE_KEY='hangul3_progress_v1';
/* 「覚えた」「また後で」は方向別（kr2ja=韓国語→日本語 / ja2kr=日本語→韓国語）に管理する。
   旧形式（配列）のデータは、両方向にコピーして引き継ぐ。 */
function normDirSets(v){
  if(Array.isArray(v)) return {kr2ja:v.slice(), ja2kr:v.slice()};
  v = (v && typeof v==='object') ? v : {};
  return {
    kr2ja: Array.isArray(v.kr2ja) ? v.kr2ja.slice() : [],
    ja2kr: Array.isArray(v.ja2kr) ? v.ja2kr.slice() : []
  };
}
function normStore(o){
  o = (o && typeof o==='object') ? o : {};
  o.mastered = normDirSets(o.mastered);
  o.review = normDirSets(o.review);
  if(!o.matchBest) o.matchBest = {};
  if(!o.study || typeof o.study!=='object') o.study = {};
  if(!o.study.days || typeof o.study.days!=='object' || Array.isArray(o.study.days)) o.study.days = {};
  if(!Array.isArray(o.goals)) o.goals = [];
  o.goals = o.goals.filter(g=>g && typeof g==='object' && /^\d{4}-\d{2}-\d{2}$/.test(g.start||'') && /^\d{4}-\d{2}-\d{2}$/.test(g.end||'') && g.from>=1 && g.to>=g.from && g.laps>=1);
  return o;
}
let store;
try{ store = normStore(JSON.parse(localStorage.getItem(STORE_KEY)||'null')); }catch(e){ store = normStore(null); }
function saveStore(){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
function isMastered(no,dir){ return store.mastered[dir||fcCfg.dir].includes(no); }
function isReview(no,dir){ return store.review[dir||fcCfg.dir].includes(no); }
function dirLabel(d){ return d==='ja2kr' ? '日本語→韓国語' : '韓国語→日本語'; }
function fcAutoOn(){ return store.fcAuto!==false; }

/* ============ TTS ============ */
let krVoice=null;
function loadVoices(){
  const vs=speechSynthesis.getVoices();
  krVoice = vs.find(v=>v.lang==='ko-KR') || vs.find(v=>v.lang&&v.lang.startsWith('ko')) || null;
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speakKr(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='ko-KR';
  if(krVoice) u.voice=krVoice;
  u.rate=0.92;
  speechSynthesis.speak(u);
}
function speakSeq(texts){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  texts.filter(Boolean).forEach(t=>{
    const u = new SpeechSynthesisUtterance(t);
    u.lang='ko-KR';
    if(krVoice) u.voice=krVoice;
    u.rate=0.92;
    speechSynthesis.speak(u);
  });
}
function stopSpeech(){ if('speechSynthesis' in window) speechSynthesis.cancel(); }
function spkBtn(text){
  return `<span class="spk" onclick="event.stopPropagation();speakKr('${text.replace(/'/g,"\\'")}')">🔊</span>`;
}

let screen='home';

function nav(to, push=true){
  if(screen==='invView'&&to!=='invView') invStop();
  if(screen==='fcView'&&to!=='fcView') stopSpeech();
  if(push) history_stack.push(screen);
  screen=to;
  document.getElementById('backBtn').classList.toggle('hidden', history_stack.length===0);
  render();
  window.scrollTo(0,0);
}
function goBack(){ if(screen==='invView') invStop(); if(screen==='fcView') stopSpeech(); screen = history_stack.pop() || 'home'; document.getElementById('backBtn').classList.toggle('hidden', history_stack.length===0); render(); window.scrollTo(0,0);}
function goHome(){ if(screen==='invView') invStop(); if(screen==='fcView') stopSpeech(); history_stack=[]; screen='home'; document.getElementById('backBtn').classList.add('hidden'); render(); window.scrollTo(0,0);}
document.getElementById('backBtn').onclick=goBack;

function exportStore(){
  const data = JSON.stringify(store, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const todayStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `hangul3_progress_${todayStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function applyImportedStore(obj){
  if(!obj || typeof obj !== 'object' || !obj.mastered || typeof obj.mastered !== 'object' || !obj.review || typeof obj.review !== 'object'){
    alert('読み込みに失敗しました。ファイル／テキストの形式が正しくないようです。');
    return false;
  }
  store = normStore({
    mastered: obj.mastered,   // 旧形式（配列）なら両方向にコピーされる
    review: obj.review,
    matchBest: obj.matchBest || {},
    lastSession: obj.lastSession || undefined,
    invRank: obj.invRank || {},
    invSet: obj.invSet || undefined,
    fcAuto: obj.fcAuto,
    study: obj.study,
    goals: obj.goals
  });
  invSet = store.invSet || {bgm:true,se:true};
  saveStore();
  alert('読み込みが完了しました。');
  nav('dataManage', false);
  return true;
}

function importStoreFromFile(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const obj = JSON.parse(e.target.result);
      applyImportedStore(obj);
    }catch(err){
      alert('読み込みに失敗しました。ファイルの内容が正しいJSON形式か確認してください。');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function importStoreFromText(){
  const txt = document.getElementById('dataTextIn').value.trim();
  if(!txt){ alert('テキストが入力されていません。'); return; }
  try{
    const obj = JSON.parse(txt);
    applyImportedStore(obj);
  }catch(err){
    alert('読み込みに失敗しました。貼り付けたテキストが正しいJSON形式か確認してください。');
  }
}

function copyDataText(){
  const ta = document.getElementById('dataText');
  ta.select();
  ta.setSelectionRange(0, 99999);
  try{
    navigator.clipboard.writeText(ta.value).then(()=>{
      alert('コピーしました。');
    }).catch(()=>{
      document.execCommand('copy');
      alert('コピーしました。');
    });
  }catch(err){
    document.execCommand('copy');
    alert('コピーしました。');
  }
}

function buildFcDeck(){
  let pool = WORDS.filter(w=>w.week===fcCfg.week);
  if(fcCfg.pos!=='all') pool = pool.filter(w=>w.pos===fcCfg.pos);
  if(fcCfg.src==='review') pool = pool.filter(w=>isReview(w.no));
  else pool = pool.filter(w=>!isMastered(w.no));
  if(fcCfg.order==='rand') pool = shuffleArr(pool.slice());
  return pool;
}
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let fcDeck=[], fcIdx=0, fcFlipped=false;
function startFc(){

}
function saveSession(){

function resumeSession(){

/* カード表示・裏返し時の自動音声
   韓→日: 表面=単語 / 裏面=例文1→例文2（単語は表面で再生済み）
   日→韓: 表面=音声なし / 裏面=単語→例文1→例文2 */
function fcAutoSpeak(){
  if(!fcAutoOn()) return;
  const w = fcDeck[fcIdx];
  if(!w){ stopSpeech(); return; }
  const kr2ja = fcCfg.dir==='kr2ja';
  if(!fcFlipped){
    if(kr2ja) speakSeq([w.kr]); else stopSpeech();
  } else {
    speakSeq(kr2ja ? [w.ex, w.ex2] : [w.kr, w.ex, w.ex2]);
  }
}

function cardTap(e){
  if(e.target.closest('.spk')) return; // 音声ボタンはこちらの処理をせず優先させる
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  if(ratio < 1/6) fcNav(-1);
  else if(ratio > 5/6) fcNav(1);
  else fcFlip();
}
function fcFlip(){
  fcFlipped=!fcFlipped;
  document.getElementById('cardOuter').classList.toggle('flipped');
  if(fcFlipped){ const fw=fcDeck[fcIdx]; if(fw) recordFlip(fw.no); fcAutoSpeak(); } else stopSpeech();
}
function fcNav(dir){
  const outer=document.getElementById('cardOuter');
  outer.classList.add(dir<0?'leaving-r':'leaving-l');
  setTimeout(()=>{
    fcIdx += dir;
    if(fcIdx<0) fcIdx=0;
    fcFlipped=false;
    saveSession();
    renderFcView();
  },140);
}
function fcMark(type){
  const w=fcDeck[fcIdx];
  const d=fcCfg.dir;
  if(type==='mastered'){
    if(!isMastered(w.no)) store.mastered[d].push(w.no);
    store.review[d] = store.review[d].filter(n=>n!==w.no);
    saveStore();
    fcDeck.splice(fcIdx,1);
    fcFlipped=false;
    saveSession();
    renderFcView();
  } else {
    if(!isReview(w.no)) store.review[d].push(w.no);
    saveStore();
    fcFlipped=false;
    fcIdx++;
    saveSession();
    renderFcView();
  }
}
function attachSwipe(el){
  let x0=null,y0=null;
  el.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)){
      fcNav(dx<0?1:-1);
    }
    x0=null;
  },{passive:true});
}

function renderQuizSetup(){

    </div>

  `;

function startQuiz(){
  const pool = WORDS.filter(w=>w.week>=quizCfg.weekFrom && w.week<=quizCfg.weekTo);
  const picks = shuffleArr(pool.slice()).slice(0,10);
  quizItems = picks.map(w=>{
    const sameP = pool.filter(x=>x.pos===w.pos && x.no!==w.no);
    let distPool = sameP.length>=3 ? sameP : pool.filter(x=>x.no!==w.no);
    const distractors = shuffleArr(distPool.slice()).slice(0,3);
    const opts = shuffleArr([w,...distractors].map(o=>({no:o.no,text: quizCfg.dir==='kr2ja'?o.ja:o.kr, read:o.read})));
    return {word:w, opts, correctNo:w.no, selected:null, graded:false};
  });
  nav('quizView');
}
function renderQuizView(){
  titleEl.textContent='クイズ（'+(quizCfg.dir==='kr2ja'?'韓→日':'日→韓')+'）';
  const gradedCount = quizItems.filter(q=>q.graded).length;
  const score = quizItems.filter(q=>q.graded && q.selected===q.correctNo).length*10;
  const itemsHtml = quizItems.map((q,i)=>{
    const w=q.word;
    const stem = quizCfg.dir==='kr2ja'
      ? `${w.kr}${spkBtn(w.kr)}` + (w.read?`<span class="stem-read">[${w.read}]</span>`:'')
      : `${w.ja}`;
    const opts = q.opts.map(o=>{
      let cls='qopt';
      if(q.graded){
        if(o.no===q.correctNo) cls+=' correct';
        else if(o.no===q.selected) cls+=' wrong';
      }
      const label = quizCfg.dir==='ja2kr'
        ? `${o.text}${o.read?` [${o.read}]`:''} ${spkBtn(o.text)}`
        : o.text;
      return `<label class="${cls}" onclick="selectOpt(${i},${o.no})">
        <input type="radio" name="q${i}" ${q.selected===o.no?'checked':''} ${q.graded?'disabled':''}>
        <span>${label}</span>
      </label>`;
    }).join('');
    let resultHtml='';
    if(q.graded){

function formatTime(s){
  const m=Math.floor(s/60), sec=(s%60).toFixed(1);
  return (m>0? m+'分':'')+sec+'秒';
}
function buildPairCards(weekFrom,weekTo){
  const pool = WORDS.filter(w=>w.week>=weekFrom && w.week<=weekTo);
  const picks = shuffleArr(pool.slice()).slice(0,6);
  let cards=[];
  picks.forEach(w=>{
    cards.push({no:w.no, side:'kr', text:w.kr, id:w.no+'-kr'});
    cards.push({no:w.no, side:'ja', text:w.ja, id:w.no+'-ja'});
  });
  return shuffleArr(cards);
}

  matchState = {cards, selected:null, mismatchPair:null, matched:[], startTs:Date.now(), timerHandle:null, finished:false, elapsed:0};

function renderMatchView(){
  titleEl.textContent='マッチングゲーム';
  if(!matchState){ nav('matchSetup',false); return; }
  const cardsHtml = matchState.cards.map((c,i)=>{
    const isMatched = matchState.matched.includes(c.no);
    const isSelected = matchState.selected===i;
    const isMismatch = matchState.mismatchPair && matchState.mismatchPair.includes(i);
    let cls='mcard '+c.side;
    if(isMatched) cls+=' matched';
    else if(isMismatch) cls+=' mismatch';
    else if(isSelected) cls+=' selected';
    return `<div class="${cls}" onclick="tapSpeedCard(${i})"><span class="mtext">${c.text}</span></div>`;
  }).join('');
  main.innerHTML = `
    <div class="mtop"><span>ペア: ${matchState.matched.length} / 6</span><span class="timer" id="mTimer">${formatTime(matchState.elapsed)}</span></div>

    <div class="mgrid">${cardsHtml}</div>

    `<div class="footer-note"><span style="text-decoration:underline;cursor:pointer" onclick="startMatch()">最初からやり直す</span></div>`}
  `;
}
function tapSpeedCard(i){
  if(matchState.finished || matchState.mismatchPair) return;
  const c = matchState.cards[i];
  if(matchState.matched.includes(c.no)) return;
  if(c.side==='kr') speakKr(c.text);
  if(matchState.selected===null){
    matchState.selected=i;
    renderMatchView();
    return;
  }
  if(matchState.selected===i){
    matchState.selected=null;
    renderMatchView();
    return;
  }
  const c1 = matchState.cards[matchState.selected];
  if(c1.no===c.no && c1.side!==c.side){
    matchState.matched.push(c1.no);
    matchState.selected=null;
    renderMatchView();
    if(matchState.matched.length===6) finishMatch();
  } else {
    matchState.mismatchPair=[matchState.selected,i];
    renderMatchView();
    setTimeout(()=>{ matchState.mismatchPair=null; matchState.selected=null; renderMatchView(); },450);
  }
}
function finishMatch(){
  matchState.finished=true;
  clearInterval(matchState.timerHandle);
  matchState.finalTime=(Date.now()-matchState.startTs)/1000;
  matchState.elapsed=matchState.finalTime;
  renderMatchView();
}
function showMatchResult(){
  const t=matchState.finalTime;
  const key='speed:'+matchCfg.weekFrom+'-'+matchCfg.weekTo;
  const prevBest=store.matchBest[key];
  const isBest = !prevBest || t<prevBest;
  if(isBest){ store.matchBest[key]=t; saveStore(); }
  main.innerHTML = `<div class="mwin">

}

function tapMemoryCard(i){
  if(memoState.awaitingNext) return;
  const c = memoState.cards[i];
  if(memoState.matched.includes(c.no)) return;
  if(memoState.open.includes(i)) return;
  if(memoState.open.length>=2) return;
  memoState.open.push(i);
  if(c.side==='kr') speakKr(c.text);
  renderMemoryView();
  if(memoState.open.length===2){
    const [i1,i2]=memoState.open;
    const c1=memoState.cards[i1], c2=memoState.cards[i2];
    if(c1.no===c2.no && c1.side!==c2.side){
      memoState.matched.push(c1.no);
      memoState.open=[];
      if(memoState.matched.length===6){
        memoState.finalTime=(Date.now()-memoState.startTs)/1000;
        memoState.awaitingNext=true;
        clearInterval(memoState.timerHandle);
      }
      renderMemoryView();
    } else {
      setTimeout(()=>{ memoState.open=[]; renderMemoryView(); },800);
    }
  }
}

/* ============ サウンド（Web Audio） ============ */
const SND={ac:null,master:null,bgmId:null,step:0,next:0};
let invSet=store.invSet||{bgm:true,se:true};
function sndInit(){
  if(!SND.ac){
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    SND.ac=new C(); SND.master=SND.ac.createGain(); SND.master.connect(SND.ac.destination);
  }
  if(SND.ac.state==='suspended') SND.ac.resume();
}
function tone(type,f0,f1,dur,vol,t0){
  const a=SND.ac; if(!a) return;
  t0=t0||a.currentTime;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t0);
  if(f1) o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(SND.master); o.start(t0); o.stop(t0+dur+0.02);
}
function noiseBurst(dur,vol){
  const a=SND.ac; if(!a) return;
  const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=a.createBufferSource(); s.buffer=b;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800;
  const g=a.createGain(); g.gain.setValueAtTime(vol,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  s.connect(f); f.connect(g); g.connect(SND.master); s.start();
}
function seShoot(){ if(invSet.se) tone('square',1100,220,0.16,0.10); }
function seBoom(){ if(invSet.se){ noiseBurst(0.35,0.5); tone('sawtooth',300,50,0.3,0.12); } }
function seBuzz(){ if(invSet.se) tone('square',120,100,0.16,0.10); }
function seEnd(){ if(invSet.se) tone('triangle',660,330,0.5,0.12); }
function bgmStart(){
  if(!SND.ac||!invSet.bgm||SND.bgmId) return;
  SND.step=0; SND.next=SND.ac.currentTime+0.1;
  SND.bgmId=setInterval(bgmSched,80);
}
function bgmSched(){
  const a=SND.ac;
  while(SND.next<a.currentTime+0.3){
    const s=SND.step, root=[0,-2,-4,-2][Math.floor(s/16)%4], p=s%8;
    tone('sawtooth',110*Math.pow(2,(root+[0,0,12,0,0,7,12,7][p])/12),null,0.18,0.07,SND.next);
    tone('square',220*Math.pow(2,(root+[12,15,19,15,12,15,19,24][p])/12),null,0.12,0.035,SND.next);
    SND.next+=0.18; SND.step++;
  }
}
function bgmStop(){ if(SND.bgmId){ clearInterval(SND.bgmId); SND.bgmId=null; } }

/* ============ 演出（花火・紙吹雪） ============ */
function fxLoop(P,frames,draw){
  const c=document.createElement('canvas');
  c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999';
  c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c);
  const g=c.getContext('2d'); let k=0;
  (function tick(){ g.clearRect(0,0,c.width,c.height); draw(P,g,k,c); if(++k<frames) requestAnimationFrame(tick); else c.remove(); })();
}
function fxFire(){
  const burst=(P,x,y)=>{ const h=Math.random()*360; for(let i=0;i<48;i++){ const a=i/48*6.283,s=2+Math.random()*3.5; P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:70,h}); } };
  fxLoop([],260,(P,g,k,c)=>{
    if(k%35===0&&k<200) burst(P,c.width*(.2+Math.random()*.6),c.height*(.15+Math.random()*.3));
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.vx*=.985; p.l--;
      if(p.l>0){ g.fillStyle=`hsla(${p.h},95%,60%,${p.l/70})`; g.beginPath(); g.arc(p.x,p.y,2.6,0,6.283); g.fill(); } });
  });
}
function fxConfetti(){
  const P=[]; for(let i=0;i<90;i++) P.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,h:Math.random()*360,s:5+Math.random()*5});
  fxLoop(P,220,(P,g)=>{ P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=.15; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillStyle=`hsl(${p.h},85%,55%)`; g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); g.restore(); }); });
}

/* ============ 日付ユーティリティ ============ */
function pad2(n){ return String(n).padStart(2,'0'); }
function dkey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayKey(){ return dkey(new Date()); }
function parseKey(k){ const a=k.split('-'); return new Date(+a[0],+a[1]-1,+a[2]); }
function dayNum(k){ const a=k.split('-'); return Math.round(Date.UTC(+a[0],+a[1]-1,+a[2])/864e5); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return dkey(d); }
function addMonths(k,n){
  const d=parseKey(k), day=d.getDate();
  d.setDate(1); d.setMonth(d.getMonth()+n);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  d.setDate(Math.min(day,last));
  return dkey(d);
}
const DOW=['日','月','火','水','木','金','土'];
function fmtDate(k){ const d=parseKey(k); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+'（'+DOW[d.getDay()]+'）'; }
function fmtShort(k){ const d=parseKey(k); return (d.getMonth()+1)+'/'+d.getDate(); }
function escHtml(t){ return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let toastTimer=null;
function showToast(msg,ms){

  if(!t){ t=document.createElement('div'); t.id='toastEl'; t.className='toast'; document.body.appendChild(t); }

/* ============ 単語検索 ============ */
const WBY={}, WMAP={};
WORDS.forEach(w=>{ WBY[w.no]=w; WMAP[w.no]=w.week; });
function kataToHira(s){ return s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }
function normQ(s){ return kataToHira(String(s||'').normalize('NFC').toLowerCase()).replace(/[\s\u3000]+/g,''); }
let SIDX=null;
function buildSearchIndex(){
  SIDX=WORDS.map(w=>({
    w, kr:normQ(w.kr), read:normQ(w.read), hanja:normQ(w.hanja), ja:normQ(w.ja),
    jaSegs:normQ(w.ja).split(/[、，,・\/／（）()]/).filter(Boolean)
  }));
}
function searchWords(q){
  q=normQ(q);
  if(!q) return [];
  if(!SIDX) buildSearchIndex();
  const out=[];
  SIDX.forEach(x=>{
    let sc=99;
    if(x.kr===q || x.jaSegs.includes(q)) sc=0;
    else if(x.kr.startsWith(q) || x.ja.startsWith(q) || x.jaSegs.some(t=>t.startsWith(q))) sc=1;
    else if(x.kr.includes(q) || x.ja.includes(q)) sc=2;
    else if(x.read.includes(q) || x.hanja.includes(q)) sc=3;
    if(sc<99) out.push({w:x.w,sc});
  });
  out.sort((a,b)=>a.sc-b.sc || a.w.no-b.w.no);
  return out.map(o=>o.w);
}

/* ============ 学習記録・目標 ============ */
/* store.study.days['YYYY-MM-DD'] = その日にフラッシュカードを裏返した単語No（同じ単語は1日1回）
   store.goals = [{id,from,to,laps,pn,pu,start,end,created}] */
const PU_LABEL={day:'日間',week:'週間',month:'か月'};
const PN_MAX={day:730,week:104,month:24};
function goalEnd(start,pn,pu){
  if(pu==='day') return addDays(start,pn-1);
  if(pu==='week') return addDays(start,pn*7-1);
  return addDays(addMonths(start,pn),-1);
}
function rangeCount(from,to){ return WORDS.filter(w=>w.week>=from && w.week<=to).length; }
function dayCountInRange(k,from,to){
  const a=store.study.days[k]||[]; let c=0;
  for(let i=0;i<a.length;i++){ const u=WMAP[a[i]]; if(u>=from && u<=to) c++; }
  return c;
}
function goalLabel(g){ return (g.from===g.to?'UNIT'+g.from:'UNIT'+g.from+'〜UNIT'+g.to)+' ・ '+g.pn+PU_LABEL[g.pu]+' ・ '+g.laps+'周'; }

/* 1つの目標の進捗を、開始日から今日まで1日ずつ再現する。
   その日の目標 = 残り単語数 ÷ 残り日数（切り上げ）。休んだ分は自動で翌日以降に上乗せされる。 */
function simGoal(g,today){
  const size=rangeCount(g.from,g.to), total=size*g.laps;
  const r={g,size,total,days:[],byDate:{},done:0,pct:0,completed:false,completedOn:null,status:'active',todayTarget:0,todayCount:0,daysLeft:0};
  if(g.start>today){ r.status='upcoming'; r.daysLeft=dayNum(g.end)-dayNum(g.start)+1; return r; }
  const last=g.end<today?g.end:today;
  let cum=0;
  for(let k=g.start;k<=last;k=addDays(k,1)){
    if(cum>=total) break;
    const left=dayNum(g.end)-dayNum(k)+1;
    const target=Math.min(size,Math.ceil((total-cum)/left));
    const raw=dayCountInRange(k,g.from,g.to);
    const eff=Math.min(raw,total-cum);
    cum+=eff;
    const e={date:k,count:raw,eff,target,achieved:eff>=target,cumAfter:cum};
    r.days.push(e); r.byDate[k]=e;
    if(cum>=total){ r.completed=true; r.completedOn=k; }
  }
  r.done=cum;
  r.pct=total?Math.min(100,Math.floor(cum/total*100)):0;
  if(r.completed) r.status='completed';
  else if(today>g.end) r.status='expired';
  else {
    const e=r.byDate[today];
    if(e){ r.todayTarget=e.target; r.todayCount=e.count; }
    r.daysLeft=dayNum(g.end)-dayNum(today)+1;
  }
  return r;
}
function dayInfo(k,sims){
  const items=[];
  sims.forEach(s=>{ const e=s.byDate[k]; if(e) items.push({g:s.g,e}); });
  return {items, active:items.length>0, achieved:items.length>0 && items.every(i=>i.e.achieved)};
}
function streakCalc(set,today){
  let cur=0, k=set.has(today)?today:addDays(today,-1);
  while(set.has(k)){ cur++; k=addDays(k,-1); }
  const arr=[...set].sort(); let max=0,run=0,prev=null;
  arr.forEach(x=>{ run=(prev && addDays(prev,1)===x)?run+1:1; if(run>max) max=run; prev=x; });
  return {cur,max};
}
/* 勉強した日 = その日に2枚以上裏返した日 / 目標到達日 = その日有効な目標がすべて当日目標に到達した日 */
function computeStats(){
  const today=todayKey();
  const sims=store.goals.map(g=>simGoal(g,today));
  const days=store.study.days;
  const studySet=new Set(Object.keys(days).filter(k=>days[k].length>=2));
  const achSet=new Set(), keys=new Set();
  sims.forEach(s=>Object.keys(s.byDate).forEach(k=>keys.add(k)));
  keys.forEach(k=>{ if(dayInfo(k,sims).achieved) achSet.add(k); });
  const a=streakCalc(studySet,today), b=streakCalc(achSet,today);
  return {today,sims,studySet,achSet,total:studySet.size,studyCur:a.cur,studyMax:a.max,achTotal:achSet.size,achCur:b.cur,achMax:b.max};
}
function todaySnapshot(){
  const st=computeStats(), k=st.today;
  return {studied:(store.study.days[k]||[]).length>=2, allAch:dayInfo(k,st.sims).achieved,
          completed:st.sims.filter(s=>s.completed).length, streak:st.studyCur};
}
/* フラッシュカードを表→裏に裏返したときに呼ばれる */
function recordFlip(no){
  const k=todayKey(), days=store.study.days;
  const arr=days[k]||(days[k]=[]);
  if(arr.includes(no)) return;
  const b=todaySnapshot();
  arr.push(no); saveStore();
  const a=todaySnapshot();
  if(a.completed>b.completed){ showToast('🏆 目標を達成しました！おめでとう！',3600); fxFire(); }
  else if(a.allAch && !b.allAch){ showToast('🎯 今日の目標を達成！',3200); fxConfetti(); }
  else if(a.studied && !b.studied){ showToast('🔥 今日の学習を達成！ 連続'+a.streak+'日',2800); }
}

function ringSvg(pct,size){
  const r=size/2-8, c=2*Math.PI*r, off=c*(1-pct/100), m=size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">
    <circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${pct>=100?'var(--ok)':'var(--ink2)'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${m} ${m})"/>
    <text x="${m}" y="${m}" text-anchor="middle" dominant-baseline="central" font-size="${size*0.22}" font-weight="700" fill="var(--ink)">${pct}%</text></svg>`;
}

function homeSummaryHtml(){
  const st=computeStats(), k=st.today;
  const n=(store.study.days[k]||[]).length;
  const act=st.sims.filter(s=>s.status==='active' && s.byDate[k]);
  const nAch=act.filter(s=>s.byDate[k].achieved).length;
  const goalTxt=act.length?`${nAch}/${act.length}`:'―';
  return `<div class="home-sum" onclick="nav('goalHome')">
    <div><b>🔥 ${st.studyCur}日</b><span>連続勉強日数</span></div>
    <div><b>${n}語</b><span>今日めくった数</span></div>
    <div><b>${goalTxt}</b><span>${act.length?'今日の目標 達成':'目標未設定'}</span></div></div>`;
}

/* ---------- 目標・記録 画面 ---------- */
function renderGoalHome(){
  titleEl.textContent='目標・記録';
  const st=computeStats(), k=st.today;
  const nToday=(store.study.days[k]||[]).length;
  const tiles=[
    ['合計勉強日数',st.total,''],['連続日数',st.studyCur,''],['最大連続日数',st.studyMax,''],
    ['合計目標到達日数',st.achTotal,'g'],['連続目標到達日数',st.achCur,'g'],['最大連続目標到達日数',st.achMax,'g']
  ].map(t=>`<div class="gtile ${t[2]}"><b>${t[1]}<small>日</small></b><span>${t[0]}</span></div>`).join('');
  const todayMsg = nToday>=2 ? `今日は${nToday}語めくりました。勉強日にカウント済みです ✅`
                  : `今日は${nToday}語。あと${2-nToday}語めくると「勉強した日」になります。`;

  const cur=st.sims.filter(s=>s.status==='active'||s.status==='upcoming');
  const past=st.sims.filter(s=>s.status==='completed'||s.status==='expired');
  const card=s=>{
    const g=s.g, per=g.start+' 〜 '+g.end;
    let badge='', info='';
    if(s.status==='completed') badge='<span class="gbadge ok">🏆 達成</span>';
    else if(s.status==='expired') badge='<span class="gbadge ng">期間終了</span>';
    else if(s.status==='upcoming') badge='<span class="gbadge up">開始前</span>';
    if(s.status==='active'){
      const tp=s.todayTarget?Math.min(100,Math.floor(s.todayCount/s.todayTarget*100)):0;
      const tAch=s.todayCount>=s.todayTarget;
      info=`<b>${s.done}</b> / ${s.total}語　残り<b>${s.total-s.done}</b>語・<b>${s.daysLeft}</b>日<br>
        今日の目標 <b>${s.todayTarget}</b>語（今日 <b>${s.todayCount}</b>語）${tAch?' ✅':''}
        <div class="gbar"><i class="${tAch?'ok':''}" style="width:${tp}%"></i></div>`;
    } else if(s.status==='upcoming'){
      info=`${fmtDate(g.start)}から開始<br>全${s.total}語（1日あたり約${Math.ceil(s.total/s.daysLeft)}語）`;
    } else if(s.status==='completed'){
      info=`<b>${s.total}</b>語をやりきりました！<br>${fmtDate(s.completedOn)}に達成`;
    } else {
      info=`<b>${s.done}</b> / ${s.total}語まで進みました（${s.pct}%）`;
    }
    return `<div class="goal-card">
      <div class="gh"><div><div class="gt">${goalLabel(g)}${badge}</div><div class="gs">${per}　対象 ${s.size}語 ×${g.laps}周＝${s.total}語</div></div>
        <button class="gx" onclick="deleteGoal('${g.id}')">削除</button></div>
      <div class="gb">${ringSvg(s.pct,86)}<div class="gi">${info}</div></div></div>`;
  };

  // 直近14日グラフ
  const days=store.study.days; const cols=[]; let mx=1;
  for(let i=13;i>=0;i--){ const d=addDays(k,-i); const c=(days[d]||[]).length; if(c>mx) mx=c; cols.push([d,c]); }
  const chart=`<div class="chart14">${cols.map(([d,c])=>{
    const cls=st.achSet.has(d)?'a':(c>=2?'s':'');
    return `<div class="col"><div class="v">${c||''}</div><div class="bar ${cls}" style="height:${Math.round(c/mx*70)}%"></div><div class="l">${parseKey(d).getDate()}</div></div>`;
  }).join('')}</div>
  <div class="cal-leg"><span><i style="background:var(--ok)"></i>目標到達日</span><span><i style="background:var(--ink2)"></i>勉強した日</span><span><i style="background:#c9c2b3"></i>1枚以下</span></div>`;

  main.innerHTML=`
    <div class="setup-block"><h3>学習の記録</h3><div class="gtiles">${tiles}</div>
      <div class="subnote">${todayMsg}<br>「勉強した日」＝その日にフラッシュカードを2枚以上裏返した日。<br>「目標到達日」＝その日有効な目標すべてで、当日の目標数に届いた日。</div></div>
    <div class="setup-block"><h3>目標（${cur.length}件）</h3>
      ${cur.map(card).join('') || '<div class="subnote">進行中の目標はありません。下のボタンから設定しましょう。</div>'}
      <button class="startbtn" onclick="openGoalNew()">＋ 目標を追加</button></div>
    <div class="setup-block"><h3>直近14日の学習単語数</h3>${chart}</div>
    <button class="startbtn" style="background:var(--ink2)" onclick="openCalendar()">📅 カレンダーを見る</button>
    ${past.length?`<div class="setup-block" style="margin-top:22px"><h3>過去の目標</h3>${past.map(card).join('')}</div>`:''}`;
}
function deleteGoal(id){
  const g=store.goals.find(x=>x.id===id); if(!g) return;
  if(!confirm('この目標を削除しますか？\n'+goalLabel(g)+'\n（学習記録は残りますが、この目標の到達記録は消えます）')) return;
  store.goals=store.goals.filter(x=>x.id!==id); saveStore(); renderGoalHome();
}

/* ---------- 目標の追加 ---------- */
let goalCfg={from:1,to:1,pn:1,pu:'week',laps:1,start:todayKey()};
function openGoalNew(){ goalCfg={from:1,to:1,pn:1,pu:'week',laps:1,start:todayKey()}; nav('goalNew'); }
function setGoalNum(key,v){
  let n=Math.floor(+v); if(!(n>=1)) n=1;
  n=Math.min(n,key==='pn'?PN_MAX[goalCfg.pu]:30);
  goalCfg[key]=n; renderGoalNew();
}
function setGoalStart(v){
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)){
    const min=addDays(todayKey(),-365);
    goalCfg.start=v<min?min:v;
  }
  renderGoalNew();
}
function goalPreview(){
  const c=goalCfg, size=rangeCount(c.from,c.to), total=size*c.laps;
  const end=goalEnd(c.start,c.pn,c.pu), days=dayNum(end)-dayNum(c.start)+1;
  const per=Math.ceil(total/days);
  const valid=days>=c.laps;
  return {size,total,end,days,per,valid};
}
function renderGoalNew(){
  titleEl.textContent='目標を追加';
  const U=Array.from({length:WEEKS_TOTAL},(_,i)=>i+1);
  const fromC=U.map(u=>`<div class="chip ${goalCfg.from===u?'active':''}" onclick="goalCfg.from=${u};if(goalCfg.to<${u})goalCfg.to=${u};renderGoalNew()">UNIT${u}</div>`).join('');
  const toC=U.map(u=>{ const dis=u<goalCfg.from; return `<div class="chip ${goalCfg.to===u?'active':''} ${dis?'disabled':''}" ${dis?'':`onclick="goalCfg.to=${u};renderGoalNew()"`}>UNIT${u}</div>`; }).join('');
  const puC=['day','week','month'].map(p=>`<div class="chip ${goalCfg.pu===p?'active':''}" onclick="goalCfg.pu='${p}';goalCfg.pn=Math.min(goalCfg.pn,PN_MAX['${p}']);renderGoalNew()">${PU_LABEL[p]}</div>`).join('');
  const pv=goalPreview();
  main.innerHTML=`
    <div class="setup-block"><h3>範囲（どこからどこまで）</h3>
      <div class="tabrow">${fromC}</div>
      <div style="text-align:center;font-size:12px;color:var(--sub);margin:4px 0;">〜</div>
      <div class="tabrow">${toC}</div></div>
    <div class="setup-block"><h3>期間（いつまでに）</h3>
      <div class="row-inline"><input class="num-in" type="number" inputmode="numeric" min="1" max="${PN_MAX[goalCfg.pu]}" value="${goalCfg.pn}" onchange="setGoalNum('pn',this.value)">
        <div class="tabs">${puC}</div></div>
      <div class="row-inline" style="margin-top:10px"><span style="font-size:12.5px;color:var(--sub)">開始日</span>
        <input class="date-in" type="date" value="${goalCfg.start}" onchange="setGoalStart(this.value)"></div></div>
    <div class="setup-block"><h3>周回数</h3>
      <div class="row-inline"><input class="num-in" type="number" inputmode="numeric" min="1" max="30" value="${goalCfg.laps}" onchange="setGoalNum('laps',this.value)"><span style="font-size:14px">周</span></div></div>
    <div class="setup-block"><h3>この目標の内容</h3>
      <div class="prev-box">
        ${goalCfg.from===goalCfg.to?'UNIT'+goalCfg.from:'UNIT'+goalCfg.from+'〜UNIT'+goalCfg.to}（<b>${pv.size}</b>語）を <b>${goalCfg.laps}</b>周 ＝ <b>${pv.total}</b>語<br>
        期間：${fmtDate(goalCfg.start)} 〜 ${fmtDate(pv.end)}（${pv.days}日間）<br>
        ${pv.valid?`1日あたり目安：約<b>${pv.per}</b>語`:`<span class="err">期間が短すぎます。同じ単語は1日1回までなので、周回数（${goalCfg.laps}周）以上の日数が必要です。</span>`}
      </div>
      <div class="subnote">・数えるのは、範囲内の単語をフラッシュカードで裏返した数です（同じ単語は1日1回まで）。別の日にもう一度めくると次の周としてカウントされます。<br>
      ・1日の目標は毎日「残りの単語数 ÷ 残りの日数」で再計算されます。休んだ分は翌日以降に自動で上乗せされます。<br>
      ・目標は複数同時に設定できます。</div></div>
    <button class="startbtn" ${pv.valid?'':'disabled'} onclick="saveGoal()">この目標で始める</button>`;
}
function saveGoal(){
  const c=goalCfg, pv=goalPreview();
  if(!pv.valid) return;
  store.goals.push({id:Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),from:c.from,to:c.to,laps:c.laps,pn:c.pn,pu:c.pu,start:c.start,end:pv.end,created:Date.now()});
  saveStore();
  showToast('🎯 目標を追加しました');
  goBack();
}

/* ---------- カレンダー ---------- */
let calY=new Date().getFullYear(), calM=new Date().getMonth(), calSel=null;
function openCalendar(){ const d=new Date(); calY=d.getFullYear(); calM=d.getMonth(); calSel=todayKey(); nav('calendar'); }
function calMove(n){ calM+=n; if(calM<0){ calM=11; calY--; } if(calM>11){ calM=0; calY++; } calSel=null; renderCalendar(); }
function calPick(k){ calSel=(calSel===k)?null:k; renderCalendar(); }
function renderCalendar(){
  titleEl.textContent='カレンダー';
  const st=computeStats(), today=st.today, days=store.study.days;
  const first=new Date(calY,calM,1), nDays=new Date(calY,calM+1,0).getDate();
  let cells='', mStudy=0, mAch=0, mWords=0;
  for(let i=0;i<first.getDay();i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=nDays;d++){
    const k=calY+'-'+pad2(calM+1)+'-'+pad2(d);
    const cnt=(days[k]||[]).length, info=dayInfo(k,st.sims);
    let cls='';
    if(info.achieved) cls='ach';
    else if(info.active && k<today) cls='miss';
    else if(cnt>=2) cls='st';
    if(k>today) cls+=' fut';
    if(k===today) cls+=' today';
    if(k===calSel) cls+=' sel';
    if(cnt>=2) mStudy++; if(info.achieved) mAch++; mWords+=cnt;
    cells+=`<div class="cal-cell ${cls}" onclick="calPick('${k}')"><span class="cd">${d}</span>${cnt?`<span class="cn">${cnt}</span>`:''}${info.achieved?'<span class="cm">✓</span>':''}</div>`;
  }
  let det='';
  if(calSel){
    const nos=days[calSel]||[], info=dayInfo(calSel,st.sims);
    const rows=info.items.map(i=>`<div>${i.e.achieved?'✅':(calSel<today?'❌':'⏳')} ${goalLabel(i.g)}：目標 <b>${i.e.target}</b>語 ／ 実績 <b>${i.e.count}</b>語</div>`).join('');
    det=`<div class="cal-det"><h4>${fmtDate(calSel)}</h4>
      学習した単語：<b>${nos.length}</b>語　${nos.length>=2?'（勉強した日 ✅）':'（勉強日の条件は2枚以上）'}
      ${rows?`<div style="margin-top:6px">${rows}</div>`:'<div style="margin-top:6px;color:var(--sub)">この日に有効な目標はありません。</div>'}
      ${nos.length?`<div class="cal-words">${nos.map(n=>WBY[n]).filter(Boolean).map(w=>`<span>${w.kr} <small>${w.ja}</small></span>`).join('')}</div>`:''}</div>`;
  }
  main.innerHTML=`
    <div class="cal-head"><button onclick="calMove(-1)">‹</button><b>${calY}年 ${calM+1}月</b><button onclick="calMove(1)">›</button></div>
    <div class="cal-grid">${DOW.map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div>
    <div class="cal-leg"><span><i style="background:var(--ok-bg);border-color:var(--ok)"></i>目標到達</span><span><i style="background:#e8eef7"></i>勉強した日</span><span><i style="background:#fbe9e6"></i>目標未達</span><span>数字＝その日にめくった単語数</span></div>
    ${det}
    <div class="subnote" style="margin-top:14px">${calM+1}月：勉強した日 <b>${mStudy}</b>日 ／ 目標到達 <b>${mAch}</b>日 ／ 合計 <b>${mWords}</b>語</div>`;
}

/* ============ 初期化 ============ */
render();
</script>
</body>
</html>
